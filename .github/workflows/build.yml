name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install QPM
        run: |
          curl -o qpm --location https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64
          chmod +x qpm
          sudo mv qpm /usr/local/bin/qpm

      - name: QPM Restore
        run: |
          cd ${{ github.workspace }}
          qpm restore

      - name: Build
        run: |
          cd ${{ github.workspace }}
          qpm s build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: |
            ./build/*.so
            ./build/debug/*.so
