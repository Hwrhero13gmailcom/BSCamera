name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install QPM
        run: |
          QPM_URL=$(curl -s https://api.github.com/repos/QuestPackageManager/QPM.CLI/releases/latest \
            | jq -r '.assets[] | select(.name | contains("linux") and (contains("x86_64") or contains("x64"))) | .browser_download_url' \
            | head -n 1)
          echo "Downloading QPM from: $QPM_URL"
          curl -L -o qpm.zip "$QPM_URL"
          unzip -o qpm.zip
          chmod +x qpm
          sudo mv qpm /usr/local/bin/qpm
          qpm --version

      - name: QPM Restore
        run: |
          cd ${{ github.workspace }}
          qpm restore

      - name: Download scotland2 so manually
        run: |
          mkdir -p ${{ github.workspace }}/extern/libs
          SCOTLAND2_URL=$(curl -s https://api.github.com/repos/QuestPackageManager/scotland2/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".so") and (contains("debug") | not)) | .browser_download_url' \
            | head -n 1)
          echo "scotland2 url: $SCOTLAND2_URL"
          curl -L -o ${{ github.workspace }}/extern/libs/libscotland2.so "$SCOTLAND2_URL"
          ls -la ${{ github.workspace }}/extern/libs/

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Build
        run: |
          cd ${{ github.workspace }}
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -B build
          cmake --build ./build

      - name: Build qmod
        run: |
          cd ${{ github.workspace }}
          qpm qmod build

      - name: Upload qmod
        uses: actions/upload-artifact@v4
        with:
          name: CameraOffsetMod-${{ github.sha }}
          path: ./*.qmod

      - name: Upload so (debug)
        uses: actions/upload-artifact@v4
        with:
          name: CameraOffsetMod-so-${{ github.sha }}
          path: |
            ./build/*.so
            ./build/debug/*.so
