name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install QPM
        run: |
          QPM_URL=$(curl -s https://api.github.com/repos/QuestPackageManager/QPM.CLI/releases/latest \
            | jq -r '.assets[] | select(.name | contains("linux") and (contains("x86_64") or contains("x64"))) | .browser_download_url' \
            | head -n 1)
          echo "Downloading QPM from: $QPM_URL"
          curl -L -o qpm.zip "$QPM_URL"
          unzip -o qpm.zip
          chmod +x qpm
          sudo mv qpm /usr/local/bin/qpm
          qpm --version

      - name: QPM Restore
        run: |
          cd ${{ github.workspace }}
          qpm restore

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: List extern libs
        run: ls -la ${{ github.workspace }}/extern/libs/ || echo "No extern/libs"

      - name: Build
        run: |
          cd ${{ github.workspace }}
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -B build
          cmake --build ./build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: |
            ./build/*.so
            ./build/debug/*.so
